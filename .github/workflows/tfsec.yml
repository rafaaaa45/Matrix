name: tfsec

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  tfsec:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v1
        with:
          terraform_version: 1.0.0

      - name: Install tfsec
        run: |
          curl -sSfL https://raw.githubusercontent.com/aquasecurity/tfsec/master/scripts/get_tfsec.sh | sh

      - name: Run tfsec
        run: tfsec .